<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커널의 스레드 계층 — 누가 무엇을 맡는가</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width: 820px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · Diagram Design</p>
    <h1>커널의 스레드 계층 — 누가 무엇을 맡는가</h1>

    <svg viewBox="0 0 960 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="paged-kernel-hierarchy-title paged-kernel-hierarchy-desc">
      <title id="paged-kernel-hierarchy-title">커널의 스레드 계층 — 누가 무엇을 맡는가</title>
      <desc id="paged-kernel-hierarchy-desc">Grid 에서 Thread 까지 다섯 단계로 좁혀지는 CUDA 스레드 계층과 각 단계가 맡는 계산 범위를 보여준다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="40" y="72" width="500" height="340" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="52" y="65" width="52" height="14" rx="2" fill="#f5f5f5"/>
      <text x="78" y="75" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">GRID</text>
      <rect x="76" y="106" width="440" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="88" y="99" width="116" height="14" rx="2" fill="#f5f5f5"/>
      <text x="146" y="109" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">THREAD BLOCK</text>
      <rect x="112" y="140" width="380" height="204" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="124" y="133" width="92" height="14" rx="2" fill="#f5f5f5"/>
      <text x="170" y="143" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">WARP (32)</text>
      <rect x="148" y="174" width="320" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <rect x="160" y="167" width="116" height="14" rx="2" fill="#f5f5f5"/>
      <text x="218" y="177" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">THREAD GROUP</text>
      <rect x="184" y="208" width="260" height="68" rx="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="196" y="201" width="68" height="14" rx="2" fill="#f5f5f5"/>
      <text x="230" y="211" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">THREAD</text>
      <text x="600" y="80" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">담당 범위</text>
      <text x="600" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">GPU 전체에 뿌려진 thread block 묶음</text>
      <text x="600" y="110" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">(num_heads × num_seqs × partitions)</text>
      <text x="600" y="136" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">쿼리 토큰 1개 × 컨텍스트 전체</text>
      <text x="600" y="150" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">shared memory 를 함께 쓴다</text>
      <text x="600" y="176" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">쿼리 토큰 1개 × 블록 1개</text>
      <text x="600" y="190" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">여러 블록을 번갈아 맡는다</text>
      <text x="600" y="216" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">쿼리 토큰 1개 × 키 토큰 1개</text>
      <text x="600" y="230" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">보통 2 스레드</text>
      <text x="600" y="256" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">그 토큰의 일부 (vec)</text>
      <text x="600" y="270" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">한 번에 16바이트씩</text>
      <text x="40" y="452" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">안쪽으로 갈수록 담당 범위가 좁아진다 — 가장 안쪽 스레드는 토큰 하나의 일부만 본다</text>
      <line x1="40" y1="484" x2="920" y2="484" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="492" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="164" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">가장 작은 실행 단위</text>
    </svg>
  </div>
</body>
</html>
