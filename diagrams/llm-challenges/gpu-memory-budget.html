<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>같은 모델, 다른 GPU — 남는 공간이 배치 크기를 정한다</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width: 820px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · Diagram Design</p>
    <h1>같은 모델, 다른 GPU — 남는 공간이 배치 크기를 정한다</h1>

    <svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpu-memory-budget-title gpu-memory-budget-desc">

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="80" y1="424" x2="920" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="72" y="427" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end">0 GB</text>
      <line x1="80" y1="328" x2="920" y2="328" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <line x1="80" y1="136" x2="920" y2="136" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <line x1="80" y1="40" x2="920" y2="40" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <text x="72" y="43" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end">48 GB</text>
      <line x1="80" y1="40" x2="80" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="240" y="232" width="160" height="192" fill="#f5f5f5"/>
      <rect x="240" y="232" width="160" height="80" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="276" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">KV 여유 10 GB</text>
      <rect x="240" y="312" width="160" height="112" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="372" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">모델 가중치 14 GB</text>
      <text x="320" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">24 GB</text>
      <text x="320" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">A10 24GB</text>
      <text x="320" y="464" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">$2/h · batch 4</text>
      <rect x="560" y="40" width="160" height="384" fill="#f5f5f5"/>
      <rect x="560" y="40" width="160" height="272" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="640" y="180" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">KV 여유 34 GB</text>
      <rect x="560" y="312" width="160" height="112" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

      <text x="640" y="28" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">48 GB</text>
      <text x="640" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">L40S 48GB</text>
      <text x="640" y="464" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">$3.75/h · batch 16</text>
      <line x1="80" y1="168" x2="920" y2="168" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
      <rect x="776" y="146" width="128" height="14" rx="2" fill="#f5f5f5"/>
      <text x="840" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">필요 KV 32 GB</text>
      <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="508" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="164" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">모델 가중치 — 먼저 고정으로 나간다</text>
      <rect x="372" y="508" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="396" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">KV 캐시로 쓸 수 있는 나머지 = 배치 크기를 정한다</text>
    </svg>
  </div>
</body>
</html>
