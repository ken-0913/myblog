<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루프라인 — 419 FLOPS/B 를 넘겨야 연산이 다 쓰인다</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width: 820px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line · Diagram Design</p>
    <h1>루프라인 — 419 FLOPS/B 를 넘겨야 연산이 다 쓰인다</h1>

    <svg viewBox="0 0 960 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roofline-l40s-title roofline-l40s-desc">
      <title id="roofline-l40s-title">루프라인 — 419 FLOPS/B 를 넘겨야 연산이 다 쓰인다</title>
      <desc id="roofline-l40s-desc">L40S 의 FP16 연산 362 TFLOPS 와 메모리 대역폭 864 GB/s 가 만나는 419 FLOPS/B 를 기준으로, 그보다 낮은 워크로드는 메모리 대역폭에 묶이고 높은 워크로드는 연산에 묶인다는 것을 보여준다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="96" y1="424" x2="896" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="96" y1="48" x2="96" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="96" y1="88" x2="896" y2="88" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <text x="88" y="91" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end">362</text>
      <text x="88" y="427" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end">0</text>
      <line x1="376" y1="88" x2="376" y2="424" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M 96,424 L 376,88 H 896" fill="none" stroke="#2d3142" stroke-width="1.6"/>
      <text x="200" y="352" fill="#7a8399" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">메모리 대역폭 한계</text>
      <text x="600" y="152" fill="#7a8399" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif">연산 한계 (362 TFLOPS)</text>
      <circle cx="236" cy="256" r="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.6"/>
      <rect x="152" y="212" width="168" height="28" rx="2" fill="#f5f5f5"/>
      <text x="236" y="224" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">① 210 FLOPS/B</text>
      <text x="236" y="236" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">memory bound</text>
      <circle cx="764" cy="88" r="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.6"/>
      <rect x="680" y="44" width="168" height="28" rx="2" fill="#f5f5f5"/>
      <text x="764" y="56" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">② 1,000 FLOPS/B</text>
      <text x="764" y="68" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">compute bound</text>
      <text x="236" y="442" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">210</text>
      <text x="376" y="442" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">419</text>
      <text x="764" y="442" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">1000</text>
      <text x="896" y="460" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="end">연산 강도 (FLOPS/B)</text>
      <text x="88" y="40" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="end">TFLOPS</text>
      <line x1="40" y1="492" x2="920" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="504" x2="168" y2="504" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="176" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">크로스오버 419 FLOPS/B = 362 TFLOPS ÷ 864 GB/s</text>
      <rect x="552" y="500" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="576" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">이 지점을 넘겨야 연산 성능을 다 쓴다</text>
    </svg>
  </div>
</body>
</html>
