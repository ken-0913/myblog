<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모델 크기별 GPU 선택</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width: 820px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>모델 크기별 GPU 선택</h1>

    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpu-selection-by-model-size-title gpu-selection-by-model-size-desc">
      <title id="gpu-selection-by-model-size-title">모델 크기별 GPU 선택</title>
      <desc id="gpu-selection-by-model-size-desc">모델이 GPU 한 장에 들어가는지, 여러 장을 묶을 때 GPU 간 통신량이 큰지에 따라 A10·L40S·H200 8장·PCIe 구성 중 하나로 갈리는 결정 흐름을 보여준다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M 340,88 H 172 Q 164,88 164,96 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="128" x2="480" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 620,88 H 776 Q 784,88 784,96 V 184" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="644" y1="228" x2="644" y2="336" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 784,272 V 312 Q 784,320 792,320 H 852 Q 860,320 860,328 V 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="196" y="68" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">예 · 지연 요구 낮음</text>
      <rect x="490" y="154" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="542" y="163" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">예 · FP8로 여유</text>
      <rect x="680" y="68" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="700" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>
      <rect x="654" y="278" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="698" y="287" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">예 · 통신량 큼</text>
      <rect x="802" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="822" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>
      <polygon points="480,48 620,88 480,128 340,88" fill="#f5f5f5"/>
      <polygon points="480,48 620,88 480,128 340,88" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">모델이 GPU 한 장에 들어가는가?</text>
      <rect x="40" y="192" width="248" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="192" width="248" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="164" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">소형 · A10 24GB</text>
      <text x="164" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">Llama-3-8B · 가장 저렴</text>
      <rect x="356" y="192" width="248" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="356" y="192" width="248" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">중형 · L40S 48GB</text>
      <text x="480" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">14B급 · 멀티 GPU 회피</text>
      <polygon points="784,184 924,228 784,272 644,228" fill="#f5f5f5"/>
      <polygon points="784,184 924,228 784,272 644,228" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="784" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">GPU 간 통신량이 큰가?</text>
      <rect x="520" y="336" width="248" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="336" width="248" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="644" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">대형 · H200 8장</text>
      <text x="644" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">DeepSeek-R1 671B · NVSwitch</text>
      <rect x="800" y="336" width="120" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="336" width="120" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="860" y="370" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">PCIe 구성</text>
      <text x="860" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">통신 적음</text>
      <line x1="40" y1="440" x2="920" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="448" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="164" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">NVLink/NVSwitch 가 필수 요건이 되는 경로</text>
      <rect x="452" y="448" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="476" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">GPU 한 장으로 끝나는 경로</text>
    </svg>
  </div>
</body>
</html>
