<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커널 퓨전 — 중간 결과를 HBM 에 내보내지 않는다</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400;
      letter-spacing:-.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width: 820px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>커널 퓨전 — 중간 결과를 HBM 에 내보내지 않는다</h1>

    <svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kernel-fusion-title kernel-fusion-desc">
      <title id="kernel-fusion-title">커널 퓨전 — 중간 결과를 HBM 에 내보내지 않는다</title>
      <desc id="kernel-fusion-desc">연산마다 HBM 을 왕복하던 것을 하나의 커널로 합치면 중간 결과가 온칩 메모리에 머물러 메모리 왕복이 한 번으로 줄어든다는 것을 보여준다.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="40" y="64" width="420" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="56" y="68" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="96" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">커널 퓨전 없음</text>
      <rect x="80" y="96" width="340" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="80" y="96" width="340" height="40" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="250" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">연산 유닛 (SRAM · 레지스터)</text>
      <rect x="80" y="256" width="340" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="80" y="256" width="340" height="40" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="250" y="279" fill="rgba(45,49,66,0.30)" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">GPU 메모리 (HBM)</text>
      <rect x="112" y="168" width="88" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="112" y="168" width="88" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="156" y="191" fill="#2d3142" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">연산 1</text>
      <rect x="220" y="168" width="88" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="220" y="168" width="88" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="191" fill="#2d3142" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">연산 2</text>
      <rect x="328" y="168" width="88" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="328" y="168" width="88" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="191" fill="#2d3142" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">연산 3</text>
      <line x1="140" y1="256" x2="140" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="172" y1="212" x2="172" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="248" y1="256" x2="248" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="280" y1="212" x2="280" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="356" y1="256" x2="356" y2="212" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="388" y1="212" x2="388" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="500" y="64" width="420" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="516" y="68" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">커널 퓨전 적용</text>
      <rect x="540" y="96" width="340" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="540" y="96" width="340" height="40" rx="4" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="710" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">연산 유닛 (SRAM · 레지스터)</text>
      <rect x="540" y="256" width="340" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="540" y="256" width="340" height="40" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="710" y="279" fill="rgba(45,49,66,0.30)" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">GPU 메모리 (HBM)</text>
      <rect x="612" y="168" width="196" height="40" rx="4" fill="#f5f5f5"/>
      <rect x="612" y="168" width="196" height="40" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="710" y="191" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">융합 커널  1 → 2 → 3</text>
      <line x1="572" y1="256" x2="572" y2="212" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="848" y1="212" x2="848" y2="256" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="572" y="238" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">읽기 1회</text>
      <text x="848" y="238" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">쓰기 1회</text>
      <text x="250" y="356" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">HBM 왕복 3번</text>
      <text x="710" y="356" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">HBM 왕복 1번</text>
      <line x1="40" y1="388" x2="920" y2="388" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="396" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="164" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">하나로 합친 커널 — 중간 결과가 칩 위에 머문다</text>
    </svg>
  </div>
</body>
</html>
