    <h1>홈랩 BentoML과 Yatai의 배포 흐름</h1>
<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bentoml-deploy-flow-title bentoml-deploy-flow-desc">
<title id="bentoml-deploy-flow-title">홈랩 BentoML과 Yatai의 배포 흐름</title>
<desc id="bentoml-deploy-flow-desc">홈랩의 배포 흐름. rocky-linux 의 Python 3.12 venv(BentoML 1.1.10)가 MLflow 3.16 레지스트리의 Production 모델(random-forest v2, skops 38.9MB)을 bentoml.mlflow.import_model 로 로컬 BentoML 스토어에 가져오고 bentofile_homelab.yaml 로 Bento 를 만든다. 로컬에서는 python:3.12-slim 이미지로 :3010 에 띄워 사용자 100명 중 >50K 23명을 확인했다. bentoml push 로 Yatai(LB 192.168.0.243, DB 는 mlflow-postgres 의 yatai, 파일은 RustFS yatai 버킷)에 올리고, BentoRequest 매니페스트를 apply 하면 yatai-image-builder 가 amd64 노드에 kaniko 빌더(제한 6Gi)를 띄워 3분 37초에 이미지를 만들어 Docker Hub hyeonjae0913/yatai-bentos 에 push 한다. Bento CRD 를 거쳐 BentoDeployment 가 yatai 네임스페이스에 API 서버 Pod(3/3, LB 192.168.0.244, ServiceMonitor)와 러너 Pod(2/2)를 하나씩 만들고, 두 Pod 는 Docker Hub 에서 이미지를 받는다. API 서버는 ServiceAccount 로 Secret 을 읽어 RustFS 키와 Redis 암호를 얻는다.</desc>
