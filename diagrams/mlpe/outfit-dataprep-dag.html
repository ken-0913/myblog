    <h1>코디 추천 데이터 준비 파이프라인 DAG (maple-outfit-dataprep)</h1>
<svg viewBox="0 0 960 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="outfit-dataprep-dag-title outfit-dataprep-dag-desc">
<title id="outfit-dataprep-dag-title">코디 추천 데이터 준비 파이프라인 DAG (maple-outfit-dataprep)</title>
<desc id="outfit-dataprep-dag-desc">KFP 파이프라인 maple-outfit-dataprep 의 실행 흐름. plan_pages 가 레벨 10구간을 층화 샘플링해 페이지 번호 목록(List[int])을 collect_characters 로 넘기고, 두 컴포넌트는 Secret nexon-api-key 를 환경변수로 주입받는다. collect_characters 가 수집한 원본 JSONL(raw)을 build_interactions 가 활성 프리셋·뷰티 정제 규칙으로 CSV 3개(interactions, characters, items)로 펼친다. 세 CSV 는 병렬 csv_to_parquet 컴포넌트 3개를 거쳐 Parquet 로 바뀌고, interactions 만 split_dataset 에서 75/15/10 으로 분할된 뒤 upload_to_s3 3개가 RustFS 버킷 maple-capstone/outfit/v1 에 올린다. 마지막으로 qa_data 가 RustFS 에서 5개 Parquet 파일을 PyArrow 로 직접 읽어 스키마·결측·비율·참조 무결성을 검사하고 Metrics 를 기록한다.</desc>
