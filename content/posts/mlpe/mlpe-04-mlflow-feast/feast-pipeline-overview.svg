<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="feast-pipeline-overview-title feast-pipeline-overview-desc">
  <title id="feast-pipeline-overview-title">4.2절 Feast: MLOps 파이프라인의 피처 스토어 자리를 채운다</title>
  <desc id="feast-pipeline-overview-desc">4.1절 그림에서 비어 있던 피처 스토어를 Feast 로 채운 그림. 책 저장소의 parquet 3개를 오프라인 스토어(RustFS)에 두고, 학습 쪽은 get_historical_features 로 시점 기준 피처를, 서빙 쪽은 materialize 로 Redis 에 옮긴 최신 피처를 get_online_features 와 피처 서버로 꺼낸다.</desc>
