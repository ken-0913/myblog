<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="drift-pipeline-overview-title drift-pipeline-overview-desc">
  <title id="drift-pipeline-overview-title">6.2절 Evidently: 모델 모니터링 자리를 채운다</title>
  <desc id="drift-pipeline-overview-desc">4.1절 그림에서 비어 있던 모델 모니터링을 Evidently 로 채운 그림. 배치 경로에서는 5장 KFP 추론 파이프라인에 detect_drift 단계를 넣어 실행마다, 실시간 경로에서는 BentoML 서비스가 최근 요청 N개(마이크로배치)가 찰 때마다 리포트를 Evidently UI 에 올린다. 비교 기준인 reference 데이터셋은 4.1절 MLflow 모델 run 에 log_input 으로 남긴 학습 피처다. 드리프트를 찾은 뒤 재학습은 사람이 판단한다.</desc>
