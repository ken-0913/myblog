<svg xmlns="http://www.w3.org/2000/svg" width="960" height="130" viewBox="0 0 960 130" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="component-kinds-title component-kinds-desc">
  <title id="component-kinds-title">컴포넌트를 만드는 세 가지 방식</title>
  <desc id="component-kinds-desc">경량 파이썬 컴포넌트(dsl.component, 실행할 때 pip install) → 컨테이너화된 파이썬 컴포넌트(dsl.component 와 target_image, 빌드할 때 설치) → 컨테이너 컴포넌트(dsl.container_component, 이미지와 명령을 직접 지정).</desc>
  <defs>
    <marker id="m-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C9C8C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-emph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0E7C86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EB6C36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="130" fill="#FFFFFF"/>
  <rect x="30.0" y="24" width="270" height="80" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="165" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">경량 파이썬 컴포넌트</text>
  <rect x="345.0" y="24" width="270" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="480" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">컨테이너화된 파이썬 컴포넌트</text>
  <rect x="660.0" y="24" width="270" height="80" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="795" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">컨테이너 컴포넌트</text>
  <path d="M302.0 64.0 L343.0 64.0" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M617.0 64.0 L658.0 64.0" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <text x="165" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#0E7C86">D 단계</text>
  <text x="480" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#0F6E56">E 단계</text>
  <text x="795" y="116" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#5F5E5A">8장</text>
</svg>
