<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="geocode-flow-title geocode-flow-desc">
  <title id="geocode-flow-title">geocode 처리 흐름</title>
  <desc id="geocode-flow-desc">東京都千代田区外神田３ → NFKC 정규화(ヶ를 ケ로, 구분자 통일) → 区/町名/丁目 분해(千代田区/外神田/3) → 丁目 일치? 예(93.2%)면 丁目 좌표, 아니오면 町名 일치? 예(6.8%)면 町 좌표, 아니오면 제외하고 건수를 Metrics 에 기록. 좌표가 붙으면 lat, lon, chome_key, geo_level 컬럼을 추가한다.</desc>
  <defs>
    <marker id="m-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C9C8C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-emph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0E7C86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EB6C36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="520" fill="#FFFFFF"/>
  <rect x="190" y="14" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#C9C8C2" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="320" y="42" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#9C9B95">도쿄도 치요다구 소토칸다 3</text>
  <rect x="190" y="96" width="260" height="56" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="320" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">NFKC 정규화</text>
  <rect x="190" y="182" width="260" height="56" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="320" y="210" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">구 / 동 / 초메로 분해</text>
  <path d="M320.0 70 L320 94" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M320.0 152 L320 180" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <path d="M320.0 238 L320 273" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <polygon points="320,275 420,310 320,345 220,310" fill="#FDEEE6" stroke="#EB6C36" stroke-width="1.4"/>
  <text x="320" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#EB6C36">초메(丁目) 일치?</text>
  <path d="M420 310 L558 310" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#m-emph)"/>
  <rect x="420.705" y="289.25" width="68.59" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="455" y="296" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">예 (93.2%)</text>
  <rect x="560" y="285" width="150" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="635" y="310" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">초메(丁目) 좌표</text>
  <path d="M320 345 L320 423" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <rect x="337.235" y="378.25" width="29.53" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="352" y="385" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#5F5E5A">아니오</text>
  <polygon points="320,425 420,460 320,495 220,460" fill="#FDEEE6" stroke="#EB6C36" stroke-width="1.4"/>
  <text x="320" y="460" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#EB6C36">동(町名) 일치?</text>
  <path d="M420 460 L558 460" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#m-emph)"/>
  <rect x="423.96" y="439.25" width="62.08" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="455" y="446" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">예 (6.8%)</text>
  <rect x="560" y="435" width="150" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="635" y="460" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">동(町) 좌표</text>
  <rect x="20" y="435" width="130" height="50" rx="8" fill="#FDEEE6" stroke="#EB6C36" stroke-width="1.4"/>
  <text x="85" y="460" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#EB6C36">제외</text>
  <path d="M220 460 L152 460" fill="none" stroke="#EB6C36" stroke-width="1.2" marker-end="url(#m-warn)"/>
  <rect x="170.235" y="439.25" width="29.53" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="185" y="446" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#EB6C36">아니오</text>
  <rect x="760" y="345" width="180" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="850" y="380" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">컬럼 추가</text>
  <path d="M710 460.0 L735 460 L735 380" fill="none" stroke="#0F6E56" stroke-width="1.2"/>
  <path d="M710 310.0 L735 310 L735 380 L758 380" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#m-emph)"/>
</svg>
