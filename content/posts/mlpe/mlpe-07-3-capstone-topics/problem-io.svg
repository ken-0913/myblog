<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="problem-io-title problem-io-desc">
  <title id="problem-io-title">입력과 출력</title>
  <desc id="problem-io-desc">입력은 주소(필수), 専有面積·築年·所在階·間取り(필수), 総階数·徒歩分·向き(선택)이다. 주소는 지오코딩으로 위도·경도가 되어 회귀 모델에 들어간다. 모델의 타깃은 log(万円/m²)이고 출력은 추정 가격(万円)과 80% 구간이다.</desc>
  <defs>
    <marker id="m-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C9C8C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-emph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0E7C86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EB6C36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="250" fill="#FFFFFF"/>
  <rect x="20" y="20" width="300" height="210" rx="12" fill="#E3F4F4" fill-opacity="0.35" stroke="#0E7C86" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="170" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#0E7C86">입력</text>
  <rect x="40" y="50" width="260" height="46" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="170" y="73" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">주소 (필수)</text>
  <rect x="40" y="108" width="260" height="50" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="170" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">면적, 준공 연도, 층, 방 구조 (필수)</text>
  <rect x="40" y="170" width="260" height="46" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="170" y="193" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">총 층수, 도보 분, 방향 (선택)</text>
  <rect x="380" y="42" width="160" height="62" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="460" y="73" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">지오코딩</text>
  <rect x="600" y="90" width="170" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="685" y="125" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">회귀 모델</text>
  <rect x="820" y="90" width="120" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="880" y="125" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">추정 가격</text>
  <path d="M300 73.0 L340 73.0 L340 73 L380 73.0" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M540 73.0 L570 73 L570 110 L598 110" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <path d="M300 133.0 L570 133.0 L570 125 L598 125" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M300 193.0 L570 193.0 L570 140 L598 140" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M770 125.0 L820 125.0" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#m-emph)"/>
</svg>
