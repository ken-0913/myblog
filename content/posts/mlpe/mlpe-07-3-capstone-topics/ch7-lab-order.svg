<svg xmlns="http://www.w3.org/2000/svg" width="960" height="130" viewBox="0 0 960 130" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="ch7-lab-order-title ch7-lab-order-desc">
  <title id="ch7-lab-order-title">7장 진행 단계</title>
  <desc id="ch7-lab-order-desc">준비 하나와 본 단계 다섯 개가 왼쪽에서 오른쪽으로 이어진다. 0 준비: 데이터 적재. A 단계: 값과 경로 전달. B 단계: 아티팩트 타입. C 단계: 아티팩트로 잇는 파이프라인. D 단계: 고정 경로로 잇는 파이프라인. E 단계: target_image.</desc>
