  <rect x="490.40000000000003" y="30" width="136" height="70" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="558.4" y="65" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">C. 아티팩트 연결</text>
