<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="lab-c-pipeline-title lab-c-pipeline-desc">
  <title id="lab-c-pipeline-title">C 단계: suumo-artifact-passing</title>
  <desc id="lab-c-pipeline-desc">download_dataset 이 Output[Dataset] 으로 CSV 를 넘기고, split_dataset(random_state=42)이 train_dataset, validation_dataset, test_dataset 세 개를 낸다. validation_dataset 만 output_file_contents 로 가서 파일 트리와 행 수를 로그로 남긴다. train 과 test 는 이후 학습과 평가에서 쓴다.</desc>
  <defs>
    <marker id="m-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C9C8C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-emph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0E7C86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EB6C36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="230" fill="#FFFFFF"/>
  <rect x="20" y="86" width="160" height="56" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="100" y="114" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">download_dataset</text>
  <rect x="260" y="86" width="160" height="56" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">split_dataset</text>
  <rect x="600" y="20" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#C9C8C2" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="675" y="43" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#9C9B95">train_dataset</text>
  <rect x="600" y="92" width="180" height="46" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="690" y="115" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">output_file_contents</text>
  <rect x="600" y="164" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#C9C8C2" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="675" y="187" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#9C9B95">test_dataset</text>
  <rect x="820" y="92" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#C9C8C2" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="880" y="115" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#9C9B95">로그</text>
  <path d="M180 114.0 L260 114.0" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <rect x="166.175" y="55.25" width="107.65" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="220" y="62" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0E7C86">Output[Dataset]</text>
  <path d="M420 114.0 L470 114 L470 43 L600 43.0" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <rect x="489.7" y="23.5" width="90.6" height="13" rx="3" fill="#FFFFFF"/>
  <text x="535" y="30" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0E7C86">train_dataset</text>
  <path d="M420 114.0 L600 115.0" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <rect x="474.2" y="93.5" width="121.6" height="13" rx="3" fill="#FFFFFF"/>
  <text x="535" y="100" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0E7C86">validation_dataset</text>
  <path d="M420 114.0 L470 114 L470 187 L600 187.0" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <rect x="492.8" y="193.5" width="84.4" height="13" rx="3" fill="#FFFFFF"/>
  <text x="535" y="200" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#0E7C86">test_dataset</text>
  <path d="M780 115.0 L820 115.0" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
</svg>
