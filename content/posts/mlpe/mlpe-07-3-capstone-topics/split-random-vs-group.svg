<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="split-random-vs-group-title split-random-vs-group-desc">
  <title id="split-random-vs-group-title">무작위 분할과 丁目 그룹 분할</title>
  <desc id="split-random-vs-group-desc">C 단계의 무작위 분할은 外神田3 의 매물 A 를 train, 매물 B 를 test 에 넣어 같은 丁目 가 양쪽에 들어간다. D 단계의 丁目 그룹 분할은 外神田3 의 매물 A 와 B 를 모두 train 에, 高輪3 의 매물 C 를 test 에 넣는다.</desc>
  <defs>
    <marker id="m-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C9C8C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-emph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0E7C86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EB6C36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="250" fill="#FFFFFF"/>
  <rect x="20" y="20" width="440" height="210" rx="12" fill="#FDEEE6" fill-opacity="0.35" stroke="#EB6C36" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="240" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#EB6C36">C 단계: 무작위 분할</text>
  <rect x="50" y="60" width="170" height="46" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="135" y="83" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">소토칸다 3 매물 A</text>
  <rect x="50" y="150" width="170" height="46" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="135" y="173" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">소토칸다 3 매물 B</text>
  <rect x="290" y="60" width="140" height="46" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="360" y="83" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">train</text>
  <rect x="290" y="150" width="140" height="46" rx="8" fill="#FDEEE6" stroke="#EB6C36" stroke-width="1.4"/>
  <text x="360" y="173" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#EB6C36">test</text>
  <path d="M220 83.0 L290 83.0" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M220 173.0 L290 173.0" fill="none" stroke="#EB6C36" stroke-width="1.2" marker-end="url(#m-warn)"/>
  <rect x="500" y="20" width="440" height="210" rx="12" fill="#E1F5EE" fill-opacity="0.35" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="720" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#0F6E56">D 단계: 초메(丁目) 그룹 분할</text>
  <rect x="530" y="44" width="170" height="40" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="615" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">소토칸다 3 매물 A</text>
  <rect x="530" y="104" width="170" height="40" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="615" y="124" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">소토칸다 3 매물 B</text>
  <rect x="530" y="170" width="170" height="40" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="615" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">타카나와 3 매물 C</text>
  <rect x="770" y="54" width="140" height="46" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="840" y="77" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">train</text>
  <rect x="770" y="167" width="140" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="840" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">test</text>
  <path d="M700 64.0 L740 64 L740 72 L768 72" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M700 124.0 L740 124 L740 82 L768 82" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M700 190.0 L770 190.0" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#m-emph)"/>
</svg>
