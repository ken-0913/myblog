<svg xmlns="http://www.w3.org/2000/svg" width="960" height="110" viewBox="0 0 960 110" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="lab-e-order-title lab-e-order-desc">
  <title id="lab-e-order-title">E 단계 진행 순서</title>
