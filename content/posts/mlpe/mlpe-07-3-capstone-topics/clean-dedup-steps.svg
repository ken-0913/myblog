  <title id="clean-dedup-steps-title">clean_dedup 처리 순서</title>
  <desc id="clean-dedup-steps-desc">원본 32,593행 → 사용할 컬럼 15개만 남김 → 같은 매물 중복 제거(物件名, 住所, 価格, 面積, 所在階 기준) → 약 24,131행 → 준공 2027년 이후 매물 제외 → 構造 57종을 RC/SRC/S/기타로 정리 → 築年数 제거, 築年만 유지 → unit_price 추가(価格_万円 / 専有面積_m2) → 같은 구 중앙 단가의 10배를 넘는 가격 오류 제외 → 24,117행.</desc>
