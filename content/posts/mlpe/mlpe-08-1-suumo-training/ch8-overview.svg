<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="ch8-overview-title ch8-overview-desc">
  <title id="ch8-overview-title">8장 전체 흐름</title>
  <desc id="ch8-overview-desc">7장이 남긴 버킷의 train, val, test Parquet 을 KFP 파이프라인이 읽는다. 피처 준비 뒤 두 갈래로 나뉜다. 위쪽은 LightGBM 학습으로 추정값, 10%, 90% 세 모델을 만들어 Model 아티팩트로 남긴다. 아래쪽은 구, 동 중앙 단가로 찍는 기준선이다. 검증이 둘을 val, test 로 채점해 MAE, MAPE, 80% 구간 적중률을 Metrics 로 남긴다. 기준선보다 나으면 저장된 모델로 주소 몇 개를 예측해 상식 범위인지 확인하고, 아니면 피처와 하이퍼파라미터를 고쳐 다시 학습한다.</desc>
  <defs>
    <marker id="m-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C9C8C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-emph" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-pipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0E7C86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EB6C36" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="m-alt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="400" fill="#FFFFFF"/>
  <rect x="200" y="20" width="560" height="300" rx="12" fill="#E3F4F4" fill-opacity="0.35" stroke="#0E7C86" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="480" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#0E7C86">KFP 파이프라인</text>
  <rect x="20" y="70" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#C9C8C2" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text x="95" y="98" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#9C9B95">train / val / test</text>
  <rect x="220" y="70" width="150" height="56" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="295" y="98" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">피처 준비</text>
  <rect x="420" y="70" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="495" y="98" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">LightGBM 학습</text>
  <rect x="610" y="150" width="130" height="56" rx="8" fill="#E3F4F4" stroke="#0E7C86" stroke-width="1.4"/>
  <text x="675" y="178" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0E7C86">검증</text>
  <rect x="420" y="230" width="150" height="56" rx="8" fill="#F4F4F2" stroke="#C9C8C2" stroke-width="0.75"/>
  <text x="495" y="258" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">기준선</text>
