  <path d="M370 98.0 L420 98.0" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <path d="M295.0 126 L295.0 258 L418 258" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
