  <path d="M570 258.0 L590 258.0 L590 195 L608 195" fill="none" stroke="#C9C8C2" stroke-width="1.2" marker-end="url(#m-line)"/>
  <path d="M675.0 206 L675.0 248" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <rect x="640.705" y="220.25" width="68.59" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="675" y="227" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0E7C86">val, test</text>
  <polygon points="860,136 945,178 860,220 775,178" fill="#FDEEE6" stroke="#EB6C36" stroke-width="1.4"/>
  <text x="860" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#EB6C36">기준선보다 나은가</text>
  <path d="M740 178.0 L773 178" fill="none" stroke="#0E7C86" stroke-width="1.2" marker-end="url(#m-pipe)"/>
  <rect x="785" y="300" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="860" y="328" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56">주소로 예측 확인</text>
  <path d="M860 220 L860.0 298" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#m-emph)"/>
  <rect x="851.745" y="252.25" width="16.51" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="860" y="259" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0F6E56">예</text>
  <path d="M860 136 L860 50 L535.0 50 L535.0 68" fill="none" stroke="#EB6C36" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#m-warn)"/>
  <rect x="573.155" y="43.25" width="133.69" height="13.5" rx="3" fill="#FFFFFF"/>
  <text x="640" y="50" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#EB6C36">아니오: 피처, 하이퍼파라미터 수정</text>
  <text x="495" y="345" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#5F5E5A">학습은 libgomp 가 든 이미지의 컨테이너 컴포넌트로 실행</text>
</svg>
