<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hl-seq-title hl-seq-desc">
<title id="hl-seq-title">홈랩 MLflow 기록 흐름</title>
<desc id="hl-seq-desc">4.1절 노트북이 MLflow 서버, Postgres, RustFS 와 주고받는 순서. 실험과 run 생성, 파라미터와 지표 기록, 모델 등록 같은 메타데이터는 MLflow 서버를 거쳐 Postgres 에 쌓이고, 데이터셋 CSV, EDA 그림, 모델 파일은 노트북 Pod 가 RustFS 에 S3 로 직접 올린다. MLflow 3 에서 log_model 은 run 아티팩트가 아니라 chapter-4/&lt;exp&gt;/models/m-… 의 logged model 로 저장되고, register_model(runs:/&lt;run&gt;/income-classifier) 은 run 경로가 비어 있어 그 logged model 을 source 로 버전을 만든다.</desc>
