<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="kfp-pipeline-overview-title kfp-pipeline-overview-desc">
  <title id="kfp-pipeline-overview-title">5장 KFP: 파이프라인 오케스트레이션 자리를 채운다</title>
  <desc id="kfp-pipeline-overview-desc">4.1절 그림에서 점선으로 비어 있던 파이프라인 오케스트레이션을 Kubeflow Pipelines 로 채운 그림. 5장의 배치 추론 파이프라인은 모델 배포 자리에서 돌며, 4.2절 Feast 피처 스토어에서 get_historical_features 로 피처를, 4.1절 MLflow 모델 레지스트리에서 Production 모델을 가져와 RustFS(책은 MinIO)에 결과를 쓴다.</desc>
