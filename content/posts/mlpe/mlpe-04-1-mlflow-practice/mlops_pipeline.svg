<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="mlops_pipeline-title mlops_pipeline-desc">
  <title id="mlops_pipeline-title">6.8 모델 등록: 1등 모델을 모델 레지스트리에 올린다</title>
  <desc id="mlops_pipeline-desc">MLOps 파이프라인 전체를 흐리게 두고 모델 레지스트리만 강조한 그림. 모델 평가·검증에서 test AUC 1등인 랜덤 포레스트(0.8608)를 MLflow 3.16 Model Registry 에 random-forest-classifier v2 로 등록했고, 백엔드는 Postgres, 모델 파일은 RustFS 에 있다. 레지스트리에서 모델 배포로 가는 연결은 5장에서 이어진다.</desc>
