      <title id="pd-disaggregation-flow-title">prefill 과 decode 를 서로 다른 GPU 로 쪼갠다</title>
      <desc id="pd-disaggregation-flow-desc">요청이 연산 최적화된 prefill 인스턴스로 먼저 가고, 그 결과인 KV 캐시가 대역폭 최적화된 decode 인스턴스로 전송되어 이어서 생성한다는 것을 보여준다.</desc>
