<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="serving-stack-layers-title serving-stack-layers-desc">
      <title id="serving-stack-layers-title">지금까지 다룬 것은 스택의 아래 세 층이다</title>
      <desc id="serving-stack-layers-desc">커널부터 실행 엔진, 캐시 관리, 라우팅/오케스트레이션까지 네 계층으로 쌓인 현대 LLM 서빙 스택에서 이 시리즈가 다룬 범위가 어디까지인지 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="140" y="380" width="680" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="380" width="680" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">커널</text>
      <text x="480" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">CUDA · Triton — GPU 연산/메모리 활용을 최대화</text>
      <line x1="480" y1="380" x2="480" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="140" y="296" width="680" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="296" width="680" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">실행 엔진</text>
      <text x="480" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">vLLM · SGLang · TensorRT-LLM — 배칭·스케줄링·스트리밍</text>
      <line x1="480" y1="296" x2="480" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="140" y="212" width="680" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="212" width="680" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="480" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">캐시 관리</text>
      <text x="480" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">vLLM KV manager · LMCache — 할당·압축·계층 오프로드</text>
      <line x1="480" y1="212" x2="480" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="140" y="128" width="680" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="128" width="680" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">라우팅 · 오케스트레이션</text>
      <text x="480" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">Dynamo · llm-d — prefill/decode 배정, 오토스케일링</text>
      <text x="40" y="60" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">위로 갈수록 결정을 더 많이 위임한다 — 아래 세 계층은 이 시리즈에서 다룬 내용이다</text>
      <line x1="40" y1="444" x2="920" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="452" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="164" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">요청을 어디로 보낼지 결정하는 계층</text>
      <rect x="364" y="452" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="388" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">이 3주차 시리즈가 다룬 계층</text>
    </svg>
