      <title id="tp-vs-pp-split-title">TP 는 너비를, PP 는 깊이를 자른다</title>
      <desc id="tp-vs-pp-split-desc">텐서 병렬은 레이어 하나를 옆으로 갈라 매 레이어마다 통신이 필요하고, 파이프라인 병렬은 레이어 묶음을 세로로 나눠 경계에서만 통신한다는 차이를 보여준다.</desc>
