<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallelism-decision-flow-title parallelism-decision-flow-desc">
      <title id="parallelism-decision-flow-title">병렬화, 언제 어디까지 가야 하나</title>
      <desc id="parallelism-decision-flow-desc">모델이 GPU 한 장에 들어가는지, 양자화로 해결되는지, 노드 안 NVLink 로 충분한지를 차례로 물어 단일 GPU · 노드 안 TP · 노드 간 TP+PP 중 하나로 좁혀가는 결정 흐름을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M 480,116 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="388" y="68" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">예</text>
      <polygon points="480,56 636,88 480,120 324,88" fill="#f5f5f5"/>
      <polygon points="480,56 636,88 480,120 324,88" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">GPU 1장에 들어가고 지연도 충분한가?</text>
      <path d="M 336,88 H 160 Q 152,88 152,96 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="224" y="68" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="77" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>
      <rect x="60" y="168" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="168" width="184" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="152" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">단일 GPU 로 서빙</text>
      <text x="152" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">추가 조치 불필요</text>
      <polygon points="480,168 612,200 480,232 348,200" fill="#f5f5f5"/>
      <polygon points="480,168 612,200 480,232 348,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">양자화하면 들어가는가?</text>
      <path d="M 480,232 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="490" y="258" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="267" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">아니오</text>
      <path d="M 396,200 H 264 Q 256,200 256,208 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="318" y="180" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">예</text>
      <rect x="164" y="296" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="164" y="296" width="184" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="256" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">양자화 후 단일 GPU</text>
      <text x="256" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">FP8 / W4A16</text>
      <polygon points="480,284 628,320 480,356 332,320" fill="#f5f5f5"/>
      <polygon points="480,284 628,320 480,356 332,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">노드 안 NVLink 8장으로 되는가?</text>
      <path d="M 480,356 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="490" y="374" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="383" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">아니오 · 그 이상 필요</text>
      <path d="M 372,320 H 700 Q 708,320 708,328 V 400" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="528" y="300" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="309" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">예</text>
      <rect x="600" y="400" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="400" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="708" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">노드 안에서 TP</text>
      <text x="708" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">NVLink · 8장까지</text>
      <rect x="360" y="400" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="400" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="468" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">노드 간 TP + PP</text>
      <text x="468" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">노드 안 TP · 노드 간 PP</text>
      <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="508" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="164" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">GPU 확장 없이 끝나는 경로</text>
      <rect x="340" y="508" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="364" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">멀티 GPU 병렬화가 필요한 경로</text>
    </svg>
