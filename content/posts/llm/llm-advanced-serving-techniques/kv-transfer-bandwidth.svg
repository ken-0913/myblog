<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kv-transfer-bandwidth-title kv-transfer-bandwidth-desc">
      <title id="kv-transfer-bandwidth-title">KV 캐시 전송 — 노드를 넘는 순간 자릿수가 바뀐다</title>
      <desc id="kv-transfer-bandwidth-desc">노드 안 NVLink 는 900 GB/s 인 반면 노드 간은 InfiniBand 로도 수십 GB/s, RDMA 가 없는 PCIe 라면 10 GB/s 대로 떨어진다는 것을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <text x="244" y="135" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="end">노드 안 · NVLink</text>
      <rect x="260" y="116" width="600" height="28" fill="#f5f5f5"/>
      <rect x="260" y="116" width="600" height="28" rx="3" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="870" y="135" fill="#4f5d75" font-size="10" font-weight="600" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">900 GB/s</text>
      <text x="244" y="207" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="end">노드 간 · InfiniBand</text>
      <rect x="260" y="188" width="50" height="28" fill="#f5f5f5"/>
      <rect x="260" y="188" width="50" height="28" rx="3" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="320" y="207" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">75 GB/s</text>
      <text x="244" y="279" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="end">노드 간 · PCIe (RDMA 없음)</text>
      <rect x="260" y="260" width="7" height="28" fill="#f5f5f5"/>
      <rect x="260" y="260" width="7" height="28" rx="3" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="277" y="279" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">10 GB/s</text>
      <text x="260" y="352" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">막대 길이는 참고용 — 노드 안과 노드 간의 실제 격차는 최대 90배다</text>
      <line x1="40" y1="388" x2="920" y2="388" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="396" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="164" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">KV 전송에 여유가 있는 구간</text>
      <rect x="340" y="396" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="364" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">전송이 병목이 되기 쉬운 구간</text>
    </svg>
