      <text x="580" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">target 가 직접 샘플링</text>
      <text x="580" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">여기서부터 다음 사이클</text>
      <text x="40" y="432" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">이번 사이클 결과 — 토큰 3개 확정 (채택 2 + target 직접 샘플 1), 남은 1개는 폐기</text>
