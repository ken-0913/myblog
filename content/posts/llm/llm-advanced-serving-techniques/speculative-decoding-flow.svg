<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="speculative-decoding-flow-title speculative-decoding-flow-desc">
      <title id="speculative-decoding-flow-title">추측 디코딩 한 사이클 — 제안하고 한 번에 검증한다</title>
      <desc id="speculative-decoding-flow-desc">작은 draft 모델이 토큰 4개를 한꺼번에 제안하면 target 모델이 한 번의 forward pass 로 전부 검증해, 일치하는 접두어는 채택하고 처음 어긋나는 지점부터는 target 이 직접 샘플링한다는 것을 보여준다.</desc>
