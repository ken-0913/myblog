      <rect x="56" y="92" width="256" height="12" rx="2" fill="#f5f5f5"/>
      <text x="184" y="101" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">① DRAFT MODEL — 토큰 4개를 한 번에 제안</text>
      <rect x="40" y="260" width="900" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="56" y="264" width="392" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="273" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">② TARGET MODEL — 한 번의 forward pass 로 4개를 동시에 검증</text>
