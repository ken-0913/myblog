<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expert-parallelism-title expert-parallelism-desc">
      <title id="expert-parallelism-title">전문가 병렬화 — 전문가를 GPU 에 나눠 놓는다</title>
      <desc id="expert-parallelism-desc">라우터가 토큰마다 전문가 하나를 고르고, 전문가들은 GPU 여러 장에 나뉘어 있어 선택된 전문가가 있는 GPU 로만 연산이 흘러간다는 것을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect x="400" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="88" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="480" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">라우터</text>
      <text x="480" y="130" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">토큰마다 전문가 선택</text>
      <rect x="80" y="200" width="380" height="168" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="96" y="204" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="213" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">GPU 1 · 전문가 0~1</text>
      <rect x="500" y="200" width="380" height="168" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="516" y="204" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="213" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.14em">GPU 2 · 전문가 2~3</text>
      <rect x="140" y="240" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="240" width="160" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="220" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">전문가 0</text>
      <text x="220" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">대기</text>
      <rect x="340" y="240" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="240" width="160" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="420" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">전문가 1</text>
      <text x="420" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">이번 토큰 처리</text>
      <rect x="560" y="240" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="240" width="160" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="640" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">전문가 2</text>
      <text x="640" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">대기</text>
      <rect x="760" y="240" width="160" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="240" width="160" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">전문가 3</text>
      <text x="840" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">대기</text>
      <line x1="480" y1="144" x2="220" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="480" y1="144" x2="420" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="480" y1="144" x2="640" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="480" y1="144" x2="840" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="40" y1="392" x2="920" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="400" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="164" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">이번 토큰이 실제로 가는 전문가</text>
      <rect x="348" y="400" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="372" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">이번 토큰은 건너뛰는 전문가</text>
    </svg>
