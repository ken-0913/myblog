      <title id="gpu-interconnect-nvswitch-title">NVLink + NVSwitch — 8장을 온전한 대역폭으로</title>
      <desc id="gpu-interconnect-nvswitch-desc">NVSwitch 를 거치면 노드 안 GPU 여덟 장이 서로 900 GB/s 전대역폭으로 통신한다는 것을 보여준다.</desc>
