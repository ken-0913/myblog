<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="optimization-three-levers-title optimization-three-levers-desc">
      <title id="optimization-three-levers-title">최적화 한 번이 만드는 세 가지 여지</title>
      <desc id="optimization-three-levers-desc">하드웨어를 바꾸지 않고 서빙을 최적화하면 더 큰 모델을 쓰거나, 동시 사용자를 더 받거나, 더 낮은 등급 칩으로 내려갈 수 있다는 세 갈래를 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M 280,158 H 352 Q 360,158 360,150 V 100 Q 360,92 368,92 H 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 280,180 H 384 Q 392,180 392,188 H 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 280,202 H 416 Q 424,202 424,210 V 276 Q 424,284 432,284 H 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="40" y="136" width="240" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="136" width="240" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="48" y="142" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="74" y="151" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="160" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">같은 하드웨어</text>
      <text x="160" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">서빙 최적화</text>
      <rect x="520" y="56" width="400" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="56" width="400" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="62" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="542" y="71" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">경험</text>
      <text x="720" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">더 큰 모델을 같은 지연으로</text>
      <text x="720" y="106" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">8B → 32B · 70B — 응답 품질이 오른다</text>
      <rect x="520" y="152" width="400" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="152" width="400" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="542" y="167" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">비용</text>
      <text x="720" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">동시 사용자를 더 받는다</text>
      <text x="720" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">수평 확장 시 GPU 수가 줄어든다</text>
      <rect x="520" y="248" width="400" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="248" width="400" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="254" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="546" y="263" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">확장성</text>
      <text x="720" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">낮은 등급 칩으로 내려간다</text>
      <text x="720" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">고급 GPU 수급난에도 배치할 수 있다</text>
      <line x1="40" y1="352" x2="920" y2="352" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
