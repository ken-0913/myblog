<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpu-three-axes-title gpu-three-axes-desc">
      <title id="gpu-three-axes-title">GPU 사양의 세 축</title>
      <desc id="gpu-three-axes-desc">VRAM 용량, 메모리 대역폭, 연산 유닛이 차례로 이어져 처리량을 만들며, 각 단계가 부족할 때 적재 실패·memory bound·compute bound로 각각 다르게 막힌다는 것을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS (drawn before boxes) -->
      <!-- main chain, all on y=132 -->
      <line x1="240" y1="132" x2="272" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="480" y1="132" x2="512" y2="132" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="720" y1="132" x2="752" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- failure drops, vertical, same x -->
      <line x1="140" y1="168" x2="140" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="380" y1="168" x2="380" y2="264" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <line x1="620" y1="168" x2="620" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- vertical-segment labels: to the side, 10px gap from stroke -->
      <rect x="150" y="204" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="176" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">부족하면</text>
      <rect x="390" y="204" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">부족하면</text>
      <rect x="630" y="204" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle" letter-spacing="0.06em">부족하면</text>

      <!-- STAGE 1 — store treatment (source cylinder) -->
      <rect x="40" y="96" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="96" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="102" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="66" y="111" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="140" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">① VRAM 용량</text>
      <text x="140" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">모델이 올라가는가</text>

      <!-- STAGE 2 — FOCAL -->
      <rect x="280" y="96" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="96" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="288" y="102" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="314" y="111" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">BOTTLENECK</text>
      <text x="380" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">② 메모리 대역폭</text>
      <text x="380" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">3.35 ~ 4.8 TB/s</text>

      <!-- STAGE 3 -->
      <rect x="520" y="96" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="96" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="102" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="548" y="111" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">COMPUTE</text>
      <text x="620" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">③ 연산 유닛</text>
      <text x="620" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">1979 teraFLOPS</text>

      <!-- OUTPUT -->
      <rect x="760" y="96" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="96" width="160" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">실제 처리량</text>

      <!-- FAILURE MODES -->
      <rect x="40" y="264" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="264" width="200" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="140" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">모델 적재 실패</text>
      <text x="140" y="308" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">시작조차 못 함</text>

      <rect x="280" y="264" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="264" width="200" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="380" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">연산 유닛이 논다</text>
      <text x="380" y="308" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">memory bound</text>

      <rect x="520" y="264" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="264" width="200" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="620" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">데이터가 쌓인다</text>
      <text x="620" y="308" fill="#7a8399" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">compute bound</text>

      <!-- LEGEND -->
      <line x1="40" y1="384" x2="920" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="392" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="164" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">LLM 추론이 실제로 막히는 지점</text>
      <rect x="440" y="392" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="464" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">통과해야 하는 단계</text>
      <line x1="672" y1="396" x2="700" y2="396" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="708" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">부족할 때 나타나는 증상</text>
    </svg>
