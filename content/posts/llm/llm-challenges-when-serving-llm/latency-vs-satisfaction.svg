<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="latency-vs-satisfaction-title latency-vs-satisfaction-desc">
      <title id="latency-vs-satisfaction-title">지연과 고객 만족도 — 줄인다고 늘 이득은 아니다</title>
      <desc id="latency-vs-satisfaction-desc">지연이 낮아질수록 고객 만족도가 오르지만 아주 낮은 구간에서는 곡선이 평평해져, 그 구간에서는 지연을 조금 내주고 처리량을 얻는 편이 낫다는 것을 보여준다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker>
        <marker id="arrow-start-accent" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="96" y1="424" x2="896" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="96" y1="64" x2="96" y2="424" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="88" y="72" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="end">고객 만족도</text>
      <text x="896" y="444" fill="#7a8399" font-size="9" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="end">지연(TTFT) 증가 →</text>
      <path d="M 96,88 C 260,92 360,120 480,232 C 600,344 720,392 896,404" fill="none" stroke="#2d3142" stroke-width="1.6"/>
      <line x1="96" y1="456" x2="304" y2="456" stroke="#eb6c36" stroke-width="1.2"/>
      <line x1="96" y1="452" x2="96" y2="460" stroke="#eb6c36" stroke-width="1.2"/>
      <line x1="304" y1="452" x2="304" y2="460" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="200" y="476" fill="#eb6c36" font-size="9" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">0.01s → 0.1s</text>
      <text x="200" y="490" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">체감 차이 없음 — 처리량으로 바꾼다</text>
      <line x1="560" y1="456" x2="864" y2="456" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="560" y1="452" x2="560" y2="460" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="864" y1="452" x2="864" y2="460" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="712" y="476" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist','Apple SD Gothic Neo','Noto Sans KR',sans-serif" text-anchor="middle">1s → 20s</text>
      <text x="712" y="490" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">만족도가 갈린다</text>
      <rect x="128" y="108" width="192" height="14" rx="2" fill="#f5f5f5"/>
      <text x="224" y="119" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">더 줄여도 거의 평평하다</text>
      <rect x="640" y="356" width="176" height="14" rx="2" fill="#f5f5f5"/>
      <text x="728" y="367" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace" text-anchor="middle">여기서는 바닥에 가깝다</text>
      <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="140" y1="528" x2="168" y2="528" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="176" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">지연을 내주고 처리량을 얻어도 되는 구간</text>
      <line x1="520" y1="528" x2="548" y2="528" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="556" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK KR',monospace">줄이는 만큼 만족도가 오르는 구간</text>
    </svg>
