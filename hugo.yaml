# 사용자/조직 사이트(username.github.io 저장소)
baseURL: "https://ken-0913.github.io/myblog/"

defaultContentLanguage: "ko"
languageCode: "ko-kr"
title: "lee's blog"
theme: "DoIt"

# 글 작성 시 기본 front matter 형식을 YAML로 고정
frontmatter:
  date: [date, publishDate]

# 발행 대상이 아닌 원본 메모(Notion export 등)를 빌드에서 제외한다.
# front matter가 없어 Hugo가 페이지로 파싱하면 "invalid YAML delimiter"로 빌드가 통째로 실패한다.
# 정리한 글은 별도 파일로 만들고, 원본은 여기에 한 줄 추가해 content/ 안에 그대로 둔다.
# 값은 파일 경로에 대한 정규식이다.
ignoreFiles:
  - "content/posts/llm/llm-ray-serving\\.md$"
  - "content/posts/llm/llm-building-cloud-vendor\\.md$"

# 검색 인덱스(JSON) 생성을 위해 홈 출력에 JSON 추가
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 마크다운에서 원시 HTML 허용
markup:
  goldmark:
    renderer:
      unsafe: true
    # 수학 수식(KaTeX) 지원: 블록 $$...$$ / \[...\], 인라인 \(...\)
    # 단일 $ 인라인은 코드 속 $ 와 충돌할 수 있어 의도적으로 제외한다.
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["\\(", "\\)"]

# 상단 네비게이션 메뉴
menu:
  main:
    - identifier: posts
      name: "Posts"
      url: "/posts/"
      weight: 1
    - identifier: categories
      name: "Categories"
      url: "/categories/"
      weight: 2
    - identifier: tags
      name: "Tags"
      url: "/tags/"
      weight: 3
    - identifier: about
      name: "About"
      url: "/about/"
      weight: 5

params:
  # 기본 테마 모드: light / dark / auto
  defaultTheme: "auto"
  # 날짜 표시 형식
  dateFormat: "2006-01-02"

  # 검색 기능 (네비게이션 바에 검색 아이콘 표시)
  search:
    enable: true
    type: "fuse"
    contentLength: 4000
    placeholder: ""
    maxResultLength: 10
    snippetLength: 30
    highlightTag: "em"

  author:
    name: "ken-0913"
    email: "hyeonjae0913@gmail.com"
    link: "https://github.com/ken-0913"

  # 홈페이지 프로필
  home:
    profile:
      enable: true
      title: ""
      subtitle: ""
      social: false
    posts:
      enable: true
      paginate: 6

  # 소셜 링크
  social:
    GitHub: "ken-0913"
    Email: "hyeonjae0913@gmail.com"
